$('noteList').innerHTML=plan.notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join('');

var nav='',html='';
plan.days.forEach(function(day,i){
 var p=dparts(day.date),id='day'+(i+1);
 nav+='<a href="#'+id+'" data-id="'+id+'">Day '+(i+1)+' · '+DAYS[p.wd]+' '+p.d+'</a>';
 var c=0,km=0,mn=0;day.stops.forEach(function(s){c+=s.costChf||0;if(s.drive){km+=s.drive.km;mn+=s.drive.min}});
 var first=day.stops[0],last=day.stops[day.stops.length-1];
 var mid=day.stops.slice(1,-1).map(function(s){return s.mapsQuery}).slice(0,9);
 html+='<section id="'+id+'"><div class="dayhead"><small>Day '+(i+1)+' · '+FULL[p.wd]+', '+p.m+' '+p.d+'</small><h2>'+esc(day.title)+'</h2><p>'+esc(day.summary)+'</p></div>'+
 '<div class="daymeta"><span>💰 ~CHF '+c+'</span><span>🚗 '+km+' km · '+dur(mn)+'</span><a href="'+dir(first.mapsQuery,last.mapsQuery,mid)+'" target="_blank" rel="noopener">🗺️ Full day route in Google Maps</a></div>';
 day.stops.forEach(function(s,j){
  var cat=CAT[s.category]||CAT.activity,key=plan.slug+':'+day.date+':'+s.start,prev=day.stops[j-1],done=!!store.get(key);
  html+='<div class="stop">';
  if(s.drive&&prev)html+='<div class="drive"><span>🚗 '+s.drive.km+' km · '+dur(s.drive.min)+' drive</span><a href="'+dir(prev.mapsQuery,s.mapsQuery)+'" target="_blank" rel="noopener">Directions</a></div>';
  html+='<div class="card'+(done?' done':'')+'" data-key="'+esc(key)+'"><div class="top"><div class="title">'+cat[0]+' '+esc(s.title)+'</div><div class="time">'+t12(s.start)+'</div></div>'+
  '<p class="desc">'+esc(s.description)+'</p><div class="chips"><span class="chip cat" style="background:var(--'+cat[2]+');color:var(--'+cat[2]+'-i)">'+cat[1]+'</span>'+
  '<span class="chip">⏱ '+dur(s.durationMin)+' · until '+t12(hhmm(mins(s.start)+s.durationMin))+'</span>'+
  (s.costChf===null||s.costChf===undefined?'':'<span class="chip">'+(s.costChf===0?'Free':'~CHF '+s.costChf)+'</span>')+'</div>'+
  (s.costNote?'<p class="cost">'+esc(s.costNote)+'</p>':'')+
  '<div class="btns"><a class="btn maps" href="'+place(s.mapsQuery)+'" target="_blank" rel="noopener">📍 Google Maps</a><a class="btn" href="'+search(s.searchQuery)+'" target="_blank" rel="noopener">🔎 Google Search</a>'+
  '<label class="chk"><input type="checkbox"'+(done?' checked':'')+'> Done</label></div></div></div>';
 });
 html+='</section>';
});
$('nav').innerHTML=nav;$('days').innerHTML=html;

document.addEventListener('change',function(e){
 if(e.target.type!=='checkbox')return;var card=e.target.closest('.card');
 card.classList.toggle('done',e.target.checked);store.set(card.getAttribute('data-key'),e.target.checked);
});
var links=[].slice.call(document.querySelectorAll('nav a'));
if('IntersectionObserver' in window){
 var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){links.forEach(function(l){var on=l.getAttribute('data-id')===en.target.id;l.classList.toggle('on',on);if(on&&l.scrollIntoView)l.scrollIntoView({block:'nearest',inline:'center'})})}})},{rootMargin:'-20% 0px -70% 0px'});
 [].slice.call(document.querySelectorAll('section')).forEach(function(s){io.observe(s)});
}
})();
</script>
</body>
</html>
